    <style type="text/css">
        .head{
            display: flex;
            justify-content: center;
            background-color: rgb(243, 198, 240);

        }

        // edit this file 
        .menu{

        }
        .menu div{

        }
        .promo{
            position: relative;
        }
        .promo span{
            position: absolute;
            left: 5px;
            top: 3px;
        }

    </style>
</head>
