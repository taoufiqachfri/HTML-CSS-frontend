<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .head{
            display:flex;
            justify-content: center;
        }
        .menu{
            display: flex;
            gap: 60px;
            align-items: center;
            height: 40px;
            justify-content: center;
        }
        .menu div{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            color: white;
            height: 30px;
            width: 70px;
            border-radius: 5px;
            transition: 0.5s;
            
        }
        .images{
            display: flex;
            margin-top: 16px;
           
        }
        .images figure>img{
            position: relative;
            width: 300px;
            transition: 0.5s;

        }
        .images figcaption>h2{
            margin-left: 50px;
            transition: 0.5s;
            width: 180px;
        }
        .images figcaption>h2:hover{
            background-color: rgb(225, 0, 255);
            transform: translateY(-20px);

        }
        .menu div:hover{
            box-shadow: 5px 5px 15px black;
            transform: scale(0.9);

        }
        .images figure>img:hover{
            transform:translateY(-20px);
            
        }
    </style>
</head>
<body>
    <div class="head"><h1>Food Filter App</h1></div>
    <div class="menu">
        <div>Lunch</div>
        <div>Dinner</div>
        <div>Snack</div>
        <div>Breakfast</div>
        <div>All</div>
    </div>
    <div class="images">
        <figure>
            <img src="./recette-couscous-marocain.png" >
            <figcaption><h2>Couscous--80DH</h2></figcaption>
            <p>"A traditional North African dish made from steamed semolina grains, often served with vegetables, meat, or fish. Light, fluffy, and full of flavor."</p>
        </figure>
        
        <figure>
            <img src="./tajine-marocain-aux-pruneaux.jpg" >
            <figcaption><h2>Tajine--50DH</h2></figcaption>
            <p>"A slow-cooked Moroccan stew named after the earthenware pot it’s cooked in, featuring tender meat or vegetables with rich spices and aromatic sauces."</p>
        </figure>
        
        <figure>
            <img src="./juice_fruits.png" >
            <figcaption><h2>Juice Fruits--12DH</h2></figcaption>
            <p>"A refreshing drink made from freshly squeezed fruits, packed with natural flavors and vitamins."</p>
        </figure>
    </div>
</body>
</html>
